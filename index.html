<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>村ウロウロRPG</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <h1>🏘️ 村ウロウロRPG</h1>

    <div id="status-bar">
      <div>現在地: <span id="location">広場</span></div>
      <div>時刻: <span id="time">朝6:00</span></div>
    </div>

    <div id="map-canvas-container">
      <canvas id="map-canvas" width="600" height="600"></canvas>
    </div>

    <div id="controls">
      <p>矢印キーで移動 | Eキーで話しかける</p>
    </div>

    <div id="message-box"></div>
  </div>

  <!-- Hero SVG を読み込み用に隠し配置 -->
  <div id="hero-storage" style="display:none;"></div>

  <script src="script.js"></script>
</body>
</html>

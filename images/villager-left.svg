<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- 足 -->
  <rect x="10" y="28" width="4" height="10" fill="#333"/>
  <rect x="16" y="28" width="4" height="10" fill="#333"/>

  <!-- ズボン -->
  <rect x="8" y="20" width="14" height="8" fill="#4a4a4a"/>

  <!-- 上半身（労働着） -->

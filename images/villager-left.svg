  <!-- 帽子（左向き） -->
  <ellipse cx="10" cy="2" rx="4" ry="2.5" fill="#8b6914"/>
  <path d="M 14 3 Q 14 0 10 0 Q 8 0 6 2" stroke="#6b5410" stroke-width="0.5" fill="none"/>

  <!-- 目 -->

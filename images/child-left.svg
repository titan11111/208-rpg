<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- 足（短い・左向き） -->
  <rect x="10" y="26" width="2.5" height="8" fill="#333"/>
  <rect x="4" y="26" width="2.5" height="8" fill="#333"/>

  <!-- ズボン -->
  <rect x="6" y="18" width="14" height="8" fill="#4169e1"/>

  <!-- 上半身 -->
  <rect x="8" y="10" width="14" height="10" fill="#ff6347"/>

  <!-- 袖 -->
  <rect x="4" y="12" width="4" height="6" fill="#ff6347"/>

  <!-- 首 -->
  <rect x="12" y="8" width="4" height="2" fill="#f5d5b8"/>

  <!-- 頭（左向き・大きめ） -->
  <circle cx="12" cy="4" r="4" fill="#f5d5b8"/>

  <!-- 髪 -->
  <ellipse cx="10" cy="0.5" rx="4" ry="2" fill="#8b4513"/>

  <!-- 目（大きい） -->
  <circle cx="12" cy="3.5" r="0.9" fill="#000"/>

  <!-- 口 -->
  <path d="M 10 6 Q 12 7 14 6" stroke="#ff1493" stroke-width="0.5" fill="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- 足 -->
  <rect x="10" y="28" width="3" height="10" fill="#333"/>
  <rect x="16" y="28" width="3" height="10" fill="#333"/>

  <!-- スカート（横向き） -->
  <polygon points="8,20 22,20 24,32 10,32" fill="#ff69b4"/>

  <!-- 上半身 -->
  <rect x="10" y="12" width="14" height="10" fill="#ffb6c1"/>

  <!-- 袖 -->
  <rect x="5" y="14" width="5" height="6" fill="#ffb6c1"/>

  <!-- 首 -->
  <rect x="12" y="10" width="4" height="2" fill="#f5d5b8"/>

  <!-- 顔（左向き） -->
  <circle cx="12" cy="6" r="4" fill="#f5d5b8"/>

  <!-- 髪 -->
  <ellipse cx="10" cy="2" rx="4" ry="3" fill="#8b4513"/>

  <!-- リボン -->
  <circle cx="8" cy="1" r="1.5" fill="#ff1493"/>

  <!-- 目 -->
  <circle cx="10" cy="5" r="0.8" fill="#000"/>

  <!-- 口 -->

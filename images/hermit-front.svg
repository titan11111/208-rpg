  <!-- 長い髭 -->
  <path d="M 17 8 Q 17 10 19 11 Q 20 11 21 11 Q 23 10 23 8" stroke="#4a3728" stroke-width="1" fill="none"/>
  <path d="M 19 11 Q 20 13 20 14" stroke="#4a3728" stroke-width="0.8" fill="none"/>

  <!-- 目 -->
  <circle cx="18" cy="5" r="0.8" fill="#000"/>
  <circle cx="22" cy="5" r="0.8" fill="#000"/>

  <!-- 杖 -->
  <line x1="28" y1="16" x2="32" y2="28" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="29" r="1.5" fill="#8b4513"/>
</svg>

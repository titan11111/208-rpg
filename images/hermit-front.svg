<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- 足 -->
  <rect x="14" y="28" width="3" height="10" fill="#333"/>
  <rect x="23" y="28" width="3" height="10" fill="#333"/>

  <!-- ローブ下部 -->
  <polygon points="10,20 30,20 28,34 12,34" fill="#6b4a8a"/>

  <!-- ローブ上部 -->
  <polygon points="11,12 29,12 28,22 12,22" fill="#8b5fa0"/>

  <!-- 首 -->
  <rect x="17" y="10" width="6" height="2" fill="#c9a961"/>

  <!-- 顔 -->
  <circle cx="20" cy="6" r="4" fill="#c9a961"/>

  <!-- 髪・長髪 -->
  <ellipse cx="20" cy="1" rx="5" ry="2" fill="#4a3728"/>

  <!-- 被り物（帽子） -->

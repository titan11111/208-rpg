<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- 足 -->
  <rect x="15" y="28" width="3" height="10" fill="#333"/>
  <rect x="22" y="28" width="3" height="10" fill="#333"/>

  <!-- 裾（地味な色） -->
  <rect x="12" y="20" width="16" height="8" fill="#4a4a4a"/>

  <!-- 上半身（着物風） -->
  <rect x="11" y="14" width="18" height="8" fill="#6b5a3f"/>

  <!-- 首 -->
  <rect x="17" y="12" width="6" height="2" fill="#d0a574"/>

  <!-- 頭（小ぶり） -->
  <circle cx="20" cy="8" r="3.5" fill="#d0a574"/>

  <!-- 白い髪（細かい） -->
  <ellipse cx="20" cy="4" rx="4" ry="2.5" fill="#dcdcdc"/>
  <path d="M 17 5 Q 20 3 23 5" stroke="#dcdcdc" stroke-width="1" fill="none"/>

  <!-- 目（小さい） -->
  <circle cx="18" cy="7" r="0.6" fill="#000"/>
  <circle cx="22" cy="7" r="0.6" fill="#000"/>

  <!-- しわ（表現） -->
  <path d="M 16 9 Q 20 10 24 9" stroke="#a0826d" stroke-width="0.3" fill="none"/>

  <!-- 口 -->
  <path d="M 18 9 Q 20 10 22 9" stroke="#8b5a3c" stroke-width="0.4" fill="none"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- 棚のフレーム（縦型） -->
  <rect x="5" y="4" width="30" height="32" fill="#8b6f47" stroke="#5a4a2a" stroke-width="1"/>

  <!-- 横板1（上） -->
  <rect x="7" y="12" width="26" height="2" fill="#6b5a42"/>

  <!-- 横板2（中） -->
  <rect x="7" y="20" width="26" height="2" fill="#6b5a42"/>

  <!-- 横板3（下） -->
  <rect x="7" y="28" width="26" height="2" fill="#6b5a42"/>

  <!-- 棚の中身（装飾） -->
  <circle cx="12" cy="9" r="2" fill="#ff6b6b"/>
  <circle cx="20" cy="9" r="2" fill="#8b6914"/>
  <circle cx="28" cy="9" r="2" fill="#4169e1"/>

  <circle cx="15" cy="17" r="2" fill="#ff6b6b"/>
  <circle cx="25" cy="17" r="2" fill="#4169e1"/>

  <circle cx="12" cy="25" r="2" fill="#8b6914"/>
  <circle cx="28" cy="25" r="2" fill="#ff6b6b"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- 足 -->
  <rect x="12" y="26" width="3" height="12" fill="#333"/>
  <rect x="25" y="26" width="3" height="12" fill="#333"/>

  <!-- 後ろ足 -->
  <rect x="10" y="26" width="2" height="12" fill="#222"/>
  <rect x="28" y="26" width="2" height="12" fill="#222"/>

  <!-- 胴体 -->
  <ellipse cx="20" cy="16" rx="10" ry="8" fill="#8b6f47"/>

  <!-- 首 -->
  <rect x="17" y="8" width="6" height="8" fill="#9d7e5c"/>

  <!-- 頭（背後） -->
  <ellipse cx="20" cy="4" rx="5" ry="4" fill="#9d7e5c"/>

  <!-- 耳 -->
  <polygon points="16,1 14,-1 15,2" fill="#9d7e5c"/>
  <polygon points="24,1 26,-1 25,2" fill="#9d7e5c"/>

  <!-- たてがみ（背後） -->
  <path d="M 18 6 Q 17 4 20 3 Q 23 4 22 6" fill="#6b5a3f"/>

  <!-- 尾（背後・垂れ下がる） -->
  <path d="M 30 16 Q 35 20 32 28" stroke="#6b5a3f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 32 28 Q 31 32 33 34" stroke="#6b5a3f" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>

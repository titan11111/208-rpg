<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- 足（右向き） -->
  <rect x="22" y="28" width="3" height="10" fill="#333"/>
  <rect x="28" y="28" width="3" height="10" fill="#333"/>

  <!-- ローブ下部（横向き） -->
  <polygon points="18,20 32,20 30,34 20,34" fill="#6b4a8a"/>

  <!-- ローブ上部 -->
  <path d="M 18 12 Q 24 10 32 14 L 30 22 Q 24 20 18 22 Z" fill="#8b5fa0"/>

  <!-- 首 -->
  <rect x="24" y="10" width="4" height="2" fill="#c9a961"/>

  <!-- 顔（右向き） -->
  <circle cx="28" cy="6" r="4" fill="#c9a961"/>

  <!-- 髪・長髪 -->
  <ellipse cx="30" cy="1" rx="4" ry="2" fill="#4a3728"/>

  <!-- 被り物 -->
  <ellipse cx="30" cy="0.5" rx="5" ry="1.5" fill="#8b5fa0"/>

  <!-- 長い髭 -->
  <path d="M 28 8 Q 30 10 32 11" stroke="#4a3728" stroke-width="1" fill="none"/>

  <!-- 目 -->
  <circle cx="28" cy="5" r="0.8" fill="#000"/>

  <!-- 杖（右手） -->
  <line x1="32" y1="16" x2="36" y2="28" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  <circle cx="36" cy="29" r="1.5" fill="#8b4513"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- 足（左向き） -->
  <rect x="10" y="28" width="3" height="10" fill="#333"/>
  <rect x="4" y="28" width="3" height="10" fill="#333"/>

  <!-- ローブ下部（横向き） -->
  <polygon points="8,20 22,20 24,34 10,34" fill="#6b4a8a"/>

  <!-- ローブ上部 -->
  <path d="M 22 12 Q 16 10 8 14 L 10 22 Q 16 20 22 22 Z" fill="#8b5fa0"/>

  <!-- 首 -->
  <rect x="12" y="10" width="4" height="2" fill="#c9a961"/>

  <!-- 顔（左向き） -->
  <circle cx="12" cy="6" r="4" fill="#c9a961"/>

  <!-- 髪・長髪 -->
  <ellipse cx="10" cy="1" rx="4" ry="2" fill="#4a3728"/>

  <!-- 被り物 -->
  <ellipse cx="10" cy="0.5" rx="5" ry="1.5" fill="#8b5fa0"/>

  <!-- 長い髭 -->
  <path d="M 12 8 Q 10 10 8 11" stroke="#4a3728" stroke-width="1" fill="none"/>

  <!-- 目 -->
  <circle cx="12" cy="5" r="0.8" fill="#000"/>

  <!-- 杖（左手） -->
  <line x1="8" y1="16" x2="4" y2="28" stroke="#8b4513" stroke-width="2" stroke-linecap="round"/>
  <circle cx="4" cy="29" r="1.5" fill="#8b4513"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- 足 -->
  <rect x="12" y="24" width="4" height="14" fill="#222"/>
  <rect x="24" y="24" width="4" height="14" fill="#222"/>

  <!-- 後ろ足 -->
  <rect x="10" y="24" width="3" height="14" fill="#111"/>
  <rect x="27" y="24" width="3" height="14" fill="#111"/>

  <!-- 胴体 -->
  <ellipse cx="20" cy="14" rx="11" ry="9" fill="#3d3d3d"/>

  <!-- 首 -->
  <rect x="17" y="6" width="6" height="8" fill="#4a4a4a"/>

  <!-- 頭（背後） -->
  <ellipse cx="20" cy="3" rx="5" ry="4" fill="#4a4a4a"/>

  <!-- 角（背後） -->
  <line x1="16" y1="1" x2="14" y2="-1" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="1" x2="26" y2="-1" stroke="#888" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 尻尾 -->
  <path d="M 30 14 Q 34 12 35 18" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 模様 -->
  <ellipse cx="16" cy="12" rx="3" ry="2" fill="#2a2a2a" opacity="0.5"/>
  <ellipse cx="24" cy="12" rx="3" ry="2" fill="#2a2a2a" opacity="0.5"/>
</svg>
